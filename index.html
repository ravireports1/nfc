<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NFC - Future Coin Miner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #1a2040;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo span {
            font-size: 12px;
            -webkit-text-fill-color: #888;
            display: block;
        }
        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1a2040;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }
        .user-badge i {
            color: #ffd200;
        }
        .card {
            background: #12182e;
            border-radius: 16px;
            padding: 20px;
            margin: 16px 0;
            border: 1px solid #1a2040;
        }
        .card-title {
            font-size: 14px;
            color: #8892b0;
            margin-bottom: 8px;
        }
        .coin-display {
            font-size: 42px;
            font-weight: bold;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .coin-label {
            font-size: 14px;
            color: #8892b0;
        }
        .btn {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0a0e1a;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #f7971e;
            color: #f7971e;
        }
        .btn-danger {
            background: #dc3545;
            color: #fff;
        }
        .btn-success {
            background: #28a745;
            color: #fff;
        }
        .kyc-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .kyc-approved {
            background: #28a74533;
            color: #28a745;
            border: 1px solid #28a745;
        }
        .kyc-pending {
            background: #dc354533;
            color: #dc3545;
            border: 1px solid #dc3545;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #8892b0;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0a0e1a;
            border: 1px solid #1a2040;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #f7971e;
        }
        .tabs {
            display: flex;
            gap: 4px;
            background: #12182e;
            padding: 4px;
            border-radius: 12px;
            margin: 16px 0;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            color: #8892b0;
        }
        .tab.active {
            background: #f7971e;
            color: #0a0e1a;
            font-weight: bold;
        }
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1a2040;
        }
        .user-item:last-child {
            border-bottom: none;
        }
        .user-info {
            display: flex;
            flex-direction: column;
        }
        .user-name {
            font-weight: bold;
        }
        .user-email {
            font-size: 12px;
            color: #8892b0;
        }
        .user-coins {
            color: #ffd200;
            font-weight: bold;
        }
        .hidden {
            display: none !important;
        }
        .admin-section {
            background: #1a2040;
            padding: 16px;
            border-radius: 12px;
            margin: 12px 0;
        }
        .admin-input-group {
            display: flex;
            gap: 8px;
            margin: 8px 0;
        }
        .admin-input-group input {
            flex: 1;
            padding: 10px;
            background: #0a0e1a;
            border: 1px solid #2a3060;
            border-radius: 8px;
            color: #fff;
        }
        .admin-input-group button {
            padding: 10px 20px;
            background: #f7971e;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #28a745;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            z-index: 999;
            display: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.error {
            background: #dc3545;
        }
        #miningTimer {
            margin-top: 8px;
            color: #ffd200;
            font-size: 14px;
        }
        .text-center {
            text-align: center;
        }
        .mt-10 {
            margin-top: 10px;
        }
        .text-muted {
            color: #8892b0;
            font-size: 14px;
        }
        .cursor-pointer {
            cursor: pointer;
            color: #f7971e;
        }
        .auth-icon {
            font-size: 64px;
            text-align: center;
        }
        .gradient-text {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Toast -->
        <div class="toast" id="toast"></div>

        <!-- Auth Screen -->
        <div id="authScreen">
            <div class="text-center" style="padding:40px 0;">
                <div class="auth-icon">⛏️</div>
                <h1 class="gradient-text">NFC</h1>
                <p class="text-muted">Future Coin Miner</p>
            </div>

            <div class="card">
                <div id="loginForm">
                    <div class="form-group">
                        <label>Username or Email</label>
                        <input type="text" id="loginUsername" placeholder="Enter username or email" />
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter password" />
                    </div>
                    <button class="btn" onclick="login()">Login</button>
                    <p class="text-center mt-10 text-muted">
                        Don't have an account? <span class="cursor-pointer" onclick="showRegister()">Register</span>
                    </p>
                </div>

                <div id="registerForm" class="hidden">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="regFullName" placeholder="John Doe" />
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="regUsername" placeholder="johndoe" />
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" placeholder="john@example.com" />
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="regPhone" placeholder="+1234567890" />
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="regPassword" placeholder="Create password" />
                    </div>
                    <button class="btn" onclick="register()">Create Account</button>
                    <p class="text-center mt-10 text-muted">
                        Already have an account? <span class="cursor-pointer" onclick="showLogin()">Login</span>
                    </p>
                </div>
            </div>
        </div>

        <!-- Main App -->
        <div id="mainApp" class="hidden">
            <!-- Header -->
            <div class="header">
                <div>
                    <div class="logo">⛏️ NFC</div>
                    <span style="font-size:10px;color:#8892b0;">Future Coin</span>
                </div>
                <div class="user-badge" onclick="logout()">
                    <i class="fas fa-user"></i>
                    <span id="headerUsername">User</span>
                    <i class="fas fa-sign-out-alt" style="color:#8892b0;font-size:14px;"></i>
                </div>
            </div>

            <!-- Balance -->
            <div class="card">
                <div class="card-title">💰 Your Balance</div>
                <div class="coin-display" id="userBalance">0.00</div>
                <div class="coin-label">NFC Coins</div>
                <div style="margin-top:12px;">
                    <span id="kycStatusBadge" class="kyc-status kyc-pending">
                        <i class="fas fa-times-circle"></i> No KYC
                    </span>
                </div>
                <button class="btn btn-outline mt-10" onclick="requestKYC()">
                    <i class="fas fa-id-card"></i> Request KYC
                </button>
            </div>

            <!-- Mining -->
            <div class="card">
                <div class="card-title">⛏️ Mining</div>
                <p class="text-muted">0.25 NFC every 24 hours</p>
                <button class="btn" id="mineBtn" onclick="startMining()">
                    <i class="fas fa-hammer"></i> Start Mining
                </button>
                <div id="miningTimer"></div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <div class="tab active" onclick="switchTab('transfer')">Transfer</div>
                <div class="tab" onclick="switchTab('users')">Users</div>
                <div class="tab hidden" onclick="switchTab('admin')" id="adminTab">Admin</div>
            </div>

            <!-- Transfer -->
            <div id="transferTab">
                <div class="card">
                    <div class="card-title">Send NFC Coins</div>
                    <div class="form-group">
                        <label>Recipient Username</label>
                        <input type="text" id="recipientUsername" placeholder="Enter username" />
                    </div>
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" id="transferAmount" placeholder="0.00" step="0.01" />
                    </div>
                    <button class="btn" onclick="transferCoins()">
                        <i class="fas fa-paper-plane"></i> Send Coins
                    </button>
                </div>
            </div>

            <!-- Users -->
            <div id="usersTab" class="hidden">
                <div class="card">
                    <div class="card-title">👥 All Users</div>
                    <div id="usersList"></div>
                </div>
            </div>

            <!-- Admin -->
            <div id="adminTabContent" class="hidden">
                <div class="admin-section">
                    <h4 style="color:#f7971e;">🛡️ Admin Panel</h4>

                    <div style="margin:12px 0;">
                        <label style="font-size:13px;color:#8892b0;">Add Coins to User</label>
                        <div class="admin-input-group">
                            <input type="text" id="adminUser" placeholder="Username" />
                            <input type="number" id="adminCoins" placeholder="Amount" step="0.01" />
                            <button onclick="adminAddCoins()">Add</button>
                        </div>
                    </div>

                    <div style="margin:12px 0;">
                        <label style="font-size:13px;color:#8892b0;">Suspend User</label>
                        <div class="admin-input-group">
                            <input type="text" id="suspendUser" placeholder="Username" />
                            <button onclick="adminSuspendUser()" style="background:#dc3545;color:#fff;">Suspend</button>
                        </div>
                    </div>

                    <div style="margin:12px 0;">
                        <label style="font-size:13px;color:#8892b0;">Approve KYC</label>
                        <div class="admin-input-group">
                            <input type="text" id="kycApproveUser" placeholder="Username" />
                            <button onclick="adminApproveKYC()" style="background:#28a745;color:#fff;">Approve</button>
                        </div>
                    </div>

                    <div id="kycRequestsList" style="margin-top:12px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- ALL JAVASCRIPT - SINGLE COPY ONLY -->
    <script>
        // ============ SUPABASE CONFIG ============
        const SUPABASE_URL = 'https://ouwlkubrbddalkaqpzsl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tfj2iKmoe7LwbrmSrp0lWg_Gi8asD4a';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ============ STATE ============
        let currentUser = null;
        let miningInterval = null;

        // ============ AUTH ============
        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }

        async function register() {
            try {
                const fullName = document.getElementById('regFullName').value.trim();
                const username = document.getElementById('regUsername').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const phone = document.getElementById('regPhone').value.trim();
                const password = document.getElementById('regPassword').value.trim();

                if (!fullName || !username || !email || !phone || !password) {
                    showToast('Please fill all fields', true);
                    return;
                }

                const { data: existing } = await supabase
                    .from('users')
                    .select('id')
                    .or(`username.eq.${username},email.eq.${email}`);

                if (existing && existing.length > 0) {
                    showToast('Username or email already taken', true);
                    return;
                }

                const deviceId = localStorage.getItem('deviceId') || 'device_' + Math.random().toString(36).substring(7);
                localStorage.setItem('deviceId', deviceId);

                const { data, error } = await supabase
                    .from('users')
                    .insert({
                        username: username,
                        full_name: fullName,
                        email: email,
                        phone: phone,
                        password: password,
                        device_id: deviceId,
                        coins: 0,
                        kyc_approved: false,
                        suspended: false
                    })
                    .select()
                    .single();

                if (error) {
                    showToast('Registration error: ' + error.message, true);
                    return;
                }

                showToast('Account created! Please login.');
                showLogin();
                document.getElementById('loginUsername').value = username;
                document.getElementById('loginPassword').value = password;
            } catch (err) {
                showToast('Error: ' + err.message, true);
            }
        }

        async function login() {
            try {
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value.trim();

                if (!username || !password) {
                    showToast('Please fill all fields', true);
                    return;
                }

                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .or(`username.eq.${username},email.eq.${username}`)
                    .eq('password', password)
                    .single();

                if (error || !data) {
                    showToast('Invalid credentials', true);
                    return;
                }

                if (data.suspended) {
                    showToast('Account suspended', true);
                    return;
                }

                currentUser = data;
                localStorage.setItem('nfc_user', JSON.stringify(data));
                renderApp();
            } catch (err) {
                showToast('Login error: ' + err.message, true);
            }
        }

        function logout() {
            localStorage.removeItem('nfc_user');
            currentUser = null;
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
            if (miningInterval) clearInterval(miningInterval);
            showToast('Logged out');
        }

        // ============ RENDER ============
        function renderApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('headerUsername').textContent = currentUser.username;
            document.getElementById('userBalance').textContent = parseFloat(currentUser.coins || 0).toFixed(2);

            const badge = document.getElementById('kycStatusBadge');
            if (currentUser.kyc_approved) {
                badge.className = 'kyc-status kyc-approved';
                badge.innerHTML = '<i class="fas fa-check-circle"></i> KYC Approved';
            } else {
                badge.className = 'kyc-status kyc-pending';
                badge.innerHTML = '<i class="fas fa-times-circle"></i> No KYC';
            }

            // Show admin tab for username 'admin'
            const isAdmin = currentUser.username === 'admin';
            document.getElementById('adminTab').classList.toggle('hidden', !isAdmin);

            checkMiningStatus();
            loadUsers();
            loadKYCRequests();
        }

        // ============ MINING ============
        async function startMining() {
            try {
                if (miningInterval) {
                    showToast('Mining already in progress', true);
                    return;
                }

                const now = Date.now();
                const lastMine = localStorage.getItem('lastMine_' + currentUser.id);

                if (lastMine) {
                    const elapsed = (now - parseInt(lastMine)) / (1000 * 60 * 60);
                    if (elapsed < 24) {
                        const remaining = 24 - elapsed;
                        showToast(`Next mine in ${remaining.toFixed(1)} hours`, true);
                        return;
                    }
                }

                const newCoins = parseFloat(currentUser.coins || 0) + 0.25;
                const { error } = await supabase
                    .from('users')
                    .update({ coins: newCoins })
                    .eq('id', currentUser.id);

                if (error) {
                    showToast('Mining error: ' + error.message, true);
                    return;
                }

                currentUser.coins = newCoins;
                localStorage.setItem('lastMine_' + currentUser.id, String(now));
                localStorage.setItem('nfc_user', JSON.stringify(currentUser));
                document.getElementById('userBalance').textContent = newCoins.toFixed(2);

                await supabase.from('transactions').insert({
                    user_id: currentUser.id,
                    sender_id: currentUser.id,
                    amount: 0.25,
                    type: 'mining'
                });

                showToast('⛏️ Mined 0.25 NFC!');
                startMiningCountdown();
            } catch (err) {
                showToast('Error: ' + err.message, true);
            }
        }

        function startMiningCountdown() {
            if (miningInterval) clearInterval(miningInterval);
            miningInterval = setInterval(() => {
                const lastMine = localStorage.getItem('lastMine_' + currentUser.id);
                if (!lastMine) {
                    clearInterval(miningInterval);
                    miningInterval = null;
                    return;
                }
                const elapsed = (Date.now() - parseInt(lastMine)) / (1000 * 60 * 60);
                if (elapsed >= 24) {
                    document.getElementById('miningTimer').textContent = '✅ Ready to mine!';
                    clearInterval(miningInterval);
                    miningInterval = null;
                } else {
                    const remaining = 24 - elapsed;
                    const hours = Math.floor(remaining);
                    const minutes = Math.floor((remaining - hours) * 60);
                    document.getElementById('miningTimer').textContent =
                        `⏳ Next mine in ${hours}h ${minutes}m`;
                }
            }, 60000);
        }

        function checkMiningStatus() {
            const lastMine = localStorage.getItem('lastMine_' + currentUser.id);
            if (lastMine) {
                const elapsed = (Date.now() - parseInt(lastMine)) / (1000 * 60 * 60);
                if (elapsed >= 24) {
                    document.getElementById('miningTimer').textContent = '✅ Ready to mine!';
                } else {
                    const remaining = 24 - elapsed;
                    const hours = Math.floor(remaining);
                    const minutes = Math.floor((remaining - hours) * 60);
                    document.getElementById('miningTimer').textContent =
                        `⏳ Next mine in ${hours}h ${minutes}m`;
                    startMiningCountdown();
                }
            } else {
                document.getElementById('miningTimer').textContent = '⏳ Ready to mine!';
            }
        }

        // ============ TRANSFER ============
        async function transferCoins() {
            try {
                if (!currentUser.kyc_approved) {
                    showToast('KYC required to transfer coins', true);
                    return;
                }

                const recipient = document.getElementById('recipientUsername').value.trim();
                const amount = parseFloat(document.getElementById('transferAmount').value);

                if (!recipient || !amount || amount <= 0) {
                    showToast('Please enter valid recipient and amount', true);
                    return;
                }

                if (amount > parseFloat(currentUser.coins)) {
                    showToast('Insufficient balance', true);
                    return;
                }

                const { data: rec, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('username', recipient)
                    .single();

                if (error || !rec) {
                    showToast('Recipient not found', true);
                    return;
                }

                if (rec.id === currentUser.id) {
                    showToast('Cannot send to yourself', true);
                    return;
                }

                const newSenderCoins = parseFloat(currentUser.coins) - amount;
                await supabase
                    .from('users')
                    .update({ coins: newSenderCoins })
                    .eq('id', currentUser.id);

                const newRecCoins = parseFloat(rec.coins || 0) + amount;
                await supabase
                    .from('users')
                    .update({ coins: newRecCoins })
                    .eq('id', rec.id);

                await supabase.from('transactions').insert({
                    sender_id: currentUser.id,
                    receiver_id: rec.id,
                    amount: amount,
                    type: 'transfer'
                });

                currentUser.coins = newSenderCoins;
                localStorage.setItem('nfc_user', JSON.stringify(currentUser));
                document.getElementById('userBalance').textContent = newSenderCoins.toFixed(2);
                document.getElementById('recipientUsername').value = '';
                document.getElementById('transferAmount').value = '';
                showToast(`✅ Sent ${amount} NFC to ${recipient}`);
                loadUsers();
            } catch (err) {
                showToast('Error: ' + err.message, true);
            }
        }

        // ============ USERS LIST ============
        async function loadUsers() {
            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('username, full_name, email, coins, kyc_approved, suspended')
                    .neq('id', currentUser.id)
                    .order('created_at', { ascending: false });

                if (error) return;

                const list = document.getElementById('usersList');
                if (!data || data.length === 0) {
                    list.innerHTML = '<p class="text-muted">No other users found</p>';
                    return;
                }

                list.innerHTML = data.map(u => `
                    <div class="user-item">
                        <div class="user-info">
                            <div class="user-name">${u.username}</div>
                            <div class="user-email">${u.full_name} • ${u.email}</div>
                            <span style="font-size:11px;color:${u.kyc_approved ? '#28a745' : '#dc3545'}">
                                ${u.kyc_approved ? '✅ KYC' : '❌ No KYC'}
                                ${u.suspended ? ' ⛔ Suspended' : ''}
                            </span>
                        </div>
                        <div class="user-coins">${parseFloat(u.coins || 0).toFixed(2)} NFC</div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Load users error:', err);
            }
        }

        // ============ KYC REQUESTS ============
        async function loadKYCRequests() {
            try {
                const { data, error } = await supabase
                    .from('kyc_requests')
                    .select('*, users(username, full_name, email)')
                    .eq('status', 'pending');

                if (error) return;

                const container = document.getElementById('kycRequestsList');
                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-muted">No pending KYC requests</p>';
                    return;
                }

                container.innerHTML = data.map(req => `
                    <div style="background:#0a0e1a;padding:10px;border-radius:8px;margin:6px 0;">
                        <strong>${req.users.username}</strong> - ${req.users.email}
                        <button onclick="adminApproveKYC('${req.users.username}')" 
                                style="background:#28a745;border:none;color:#fff;padding:4px 12px;border-radius:6px;cursor:pointer;float:right;">
                            Approve
                        </button>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Load KYC error:', err);
            }
        }

        // ============ ADMIN ============
        async function adminAddCoins() {
            try {
                const username = document.getElementById('adminUser').value.trim();
                const amount = parseFloat(document.getElementById('adminCoins').value);

                if (!username || !amount) {
                    showToast('Enter username and amount', true);
                    return;
                }

                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .single();

                if (error || !data) {
                    showToast('User not found', true);
                    return;
                }

                const newCoins = parseFloat(data.coins || 0) + amount;
                await supabase
                    .from('users')
                    .update({ coins: newCoins })
                    .eq('id', data.id);

                await supabase.from('transactions').insert({
                    user_id: data.id,
                    sender_id: currentUser.id,
                    amount: amount,
                    type: 'admin'
                });

                showToast(`✅ Added ${amount} NFC to ${username}`);
                document.getElementById('adminUser').value = '';
                document.getElementById('adminCoins').value = '';
                loadUsers();
                if (data.id === currentUser.id) {
                    currentUser.coins = newCoins;
                    localStorage.setItem('nfc_user', JSON.stringify(currentUser));
                    document.getElementById('userBalance').textContent = newCoins.toFixed(2);
                }
            } catch (err) {
                showToast('Error: ' + err.message, true);
            }
        }

        async function adminSuspendUser() {
            try {
                const username = document.getElementById('suspendUser').value.trim();
                if (!username) {
                    showToast('Enter username', true);
                    return;
                }

                const { data, error } = await supabase
                    .from('users')
                    .update({ suspended: true })
                    .eq('username', username)
                    .select();

                if (error) {
                    showToast('Error: ' + error.message, true);
                    return;
                }

                showToast(`⛔ Suspended ${username}`);
                document.getElementById('suspendUser').value = '';
                loadUsers();
            } catch (err) {
                showToast('Error: ' + err.message, true);
            }
        }

        async function adminApproveKYC(username = null) {
            try {
                const target = username || document.getElementById('kycApproveUser').value.trim();
                if (!target) {
                    showToast('Enter username', true);
                    return;
                }

                const { data, error } = await supabase
                    .from('users')
                    .update({ kyc_approved: true })
                    .eq('username', target)
                    .select();

                if (error) {
                    showToast('Error: ' + error.message, true);
                    return;
                }

                if (data && data.length > 0) {
                    await supabase
                        .from('kyc_requests')
                        .update({ status: 'approved' })
                        .eq('user_id', data[0].id);

                    showToast(`✅ KYC Approved for ${target}`);
                    document.getElementById('kycApproveUser').value = '';
                    loadUsers();
                    loadKYCRequests();

                    if (data[0].id === currentUser.id) {
                        currentUser.kyc_approved = true;
                        localStorage.setItem('nfc_user', JSON.stringify(currentUser));
                        renderApp();
                    }
                }
            } catch (err) {
                showToast('Error: ' + err.message, true);
            }
        }

        // ============ KYC REQUEST ============
        async function requestKYC() {
            try {
                if (currentUser.kyc_approved) {
                    showToast('Already KYC approved');
                    return;
                }

                const { data: existing } = await supabase
                    .from('kyc_requests')
                    .select('id')
                    .eq('user_id', currentUser.id)
                    .eq('status', 'pending');

                if (existing && existing.length > 0) {
                    showToast('KYC request already sent', true);
                    return;
                }

                const { error } = await supabase
                    .from('kyc_requests')
                    .insert({
                        user_id: currentUser.id,
                        email: currentUser.email
                    });

                if (error) {
                    showToast('Error: ' + error.message, true);
                    return;
                }

                showToast('📧 KYC request sent to admin');
            } catch (err) {
                showToast('Error: ' + err.message, true);
            }
        }

        // ============ UI HELPERS ============
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('#transferTab, #usersTab, #adminTabContent').forEach(t => t.classList.add('hidden'));

            if (tab === 'transfer') {
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.getElementById('transferTab').classList.remove('hidden');
            } else if (tab === 'users') {
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.getElementById('usersTab').classList.remove('hidden');
                loadUsers();
            } else if (tab === 'admin') {
                document.querySelector('.tab:nth-child(3)').classList.add('active');
                document.getElementById('adminTabContent').classList.remove('hidden');
                loadKYCRequests();
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // ============ INIT ============
        const savedUser = localStorage.getItem('nfc_user');
        if (savedUser) {
            try {
                currentUser = JSON.parse(savedUser);
                renderApp();
            } catch (e) {
                localStorage.removeItem('nfc_user');
            }
        }

        console.log('🚀 NFC Future Coin Miner Loaded!');
        console.log('✅ Connected to Supabase');
    </script>
</body>
</html>
